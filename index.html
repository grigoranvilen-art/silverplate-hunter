<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Silverplate Hunter — витрина находок</title>
<style>:root{color-scheme:light;--ink:#102a26;--muted:#52645e;--paper:#f5f7f5;--edge:#d9e3de;--green:#155446;--card:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.48 system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a95725;outline-offset:3px}[hidden]{display:none!important}.shell{width:min(1180px,calc(100% - 48px));margin:auto}
.mast{background:#0f3029;color:#eaf5eb}.mast .shell{display:flex;justify-content:space-between;align-items:center;min-height:68px;gap:16px}.mast span{font-size:.88rem;color:#cbe0d4}.brand{font-size:1.25rem;font-weight:750}.brand em{font:italic 1.18em Georgia,serif}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:3rem;align-items:center;padding:3.5rem 0 3rem;border-bottom:1px solid var(--edge)}.kicker,.card-brand{color:var(--green);font-size:.875rem;font-weight:750;margin:0 0 .5rem}.hero h1,h2{font-family:Georgia,serif;font-weight:500}.hero h1{font-size:clamp(3rem,7vw,5.8rem);line-height:.93;letter-spacing:-.06em;margin:.25rem 0 1.1rem}.intro{max-width:33rem;color:var(--muted)}.hero-photo{padding:0;background:#183a33;color:white;border:0;border-radius:16px;overflow:hidden;text-align:left}.hero-photo img{width:100%;height:256px;display:block;object-fit:cover;object-position:center 47%}.hero-photo span{display:block;padding:.85rem 1.05rem}
.catalog{padding:1.8rem 0 4rem}.heading{display:flex;align-items:baseline;justify-content:space-between;gap:.75rem}.heading h2{margin:0 0 1rem;font-size:2rem}.heading p{margin:0;color:var(--muted)}.controls{display:grid;grid-template-columns:2fr 1fr 1fr;gap:.8rem}.controls label{display:grid;gap:.28rem;font-size:.875rem;font-weight:650}.controls input,.controls select{min-width:0;width:100%;color:var(--ink);background:white;border:1px solid #aebdb5;border-radius:8px;padding:.64rem .72rem;font-size:1rem}.controls select{appearance:none;padding-right:2rem;background:white linear-gradient(45deg,transparent 50%,#31594e 50%) calc(100% - 16px) 50%/6px 6px no-repeat}.categories{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0 1.5rem}.categories button,.more{background:white;color:var(--green);border:1px solid #aebdb5;border-radius:7px;padding:.42rem .7rem;font-size:.875rem;font-weight:650}.categories [aria-pressed=true],.open{background:var(--green);color:white;border-color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.1rem}.card{overflow:hidden;background:var(--card);border:1px solid var(--edge);border-radius:12px;display:flex;flex-direction:column}.cover{position:relative;display:grid;place-items:center;border:0;background:#e2ede7;width:100%;aspect-ratio:1.68;color:var(--green)}.cover img{position:absolute;width:100%;height:100%;object-fit:cover;inset:0}.no-photo{border:1px solid #9fb8ac;border-radius:5px;padding:.35rem .65rem;font-size:.875rem}.card-info{display:flex;flex:1;flex-direction:column;padding:1rem}.card h3{font-size:1rem;margin:0 0 .4rem;line-height:1.35}.city{color:var(--muted);margin:0 0 .9rem}.card-foot{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-top:auto}.card-foot strong,.price{font-size:1.25rem}
dialog{padding:0;border:1px solid var(--edge);border-radius:14px;width:min(890px,calc(100% - 24px));max-height:92vh;color:var(--ink)}dialog::backdrop{background:#08251ed1}.detail{position:relative;display:grid;grid-template-columns:1fr 1fr}.close{position:sticky;grid-column:1/-1;justify-self:end;top:8px;z-index:1;margin:8px 8px -46px 0;width:38px;height:38px;border:1px solid var(--edge);border-radius:50%;background:white;font-size:1.4rem;color:var(--ink)}.detail-info{padding:2.7rem 1.5rem 1.5rem}.detail h2{font-size:1.6rem;line-height:1.15;margin:.2rem 0}.price{font-weight:750}#gallery{background:#e2ede7;padding:1rem;min-width:0}#gallery>img{width:100%;height:min(50vh,420px);display:block;object-fit:contain;background:#d5e3da;border-radius:8px}.thumbs{display:flex;gap:.35rem;overflow:auto;margin-top:.6rem}.thumbs button{flex:0 0 48px;padding:2px;background:white;border:2px solid transparent;border-radius:5px}.thumbs button[aria-pressed=true]{border-color:var(--green)}.thumbs img{width:100%;height:44px;object-fit:cover;display:block}.open{display:inline-block;border-radius:7px;padding:.62rem .85rem;text-decoration:none;font-weight:650}dl{margin:1rem 0}dt{font-size:.875rem;font-weight:700;color:var(--green)}dd{margin:0 0 .45rem;overflow-wrap:anywhere}
@media(max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{gap:1.5rem}.hero-photo img{height:210px}}
@media(max-width:570px){.shell{width:calc(100% - 28px)}.hero,.detail{grid-template-columns:1fr}.hero{padding:2rem 0}.hero-photo img{height:195px}.grid{grid-template-columns:1fr}.controls{grid-template-columns:1fr 1fr}.search{grid-column:1/-1}.detail-info{padding-top:1.25rem}}

.controls{grid-template-columns:2fr 1fr}
.order{display:grid;gap:.65rem;margin-top:1rem}
.order label{display:grid;gap:.25rem;font-size:.875rem;font-weight:650}
.order input{min-width:0;border:1px solid #aebdb5;border-radius:8px;padding:.55rem .65rem;color:var(--ink)}
.order .open{justify-self:start;border:0}
#order-result{margin:0;color:var(--muted)}
#order-result:empty{display:none}
@media(max-width:570px){.controls{grid-template-columns:1fr}}
</style>


</head>
<body>
<header class="mast">
  <div class="shell"><div class="brand">Silverplate <em>Hunter</em></div><span>Подборка винтажа</span></div>
</header>
<main class="shell">
  <section class="hero">
    <div><h1>Винтажная мебель<br>и посуда</h1><p class="intro">Выбери предмет и открой карточку, чтобы посмотреть фото и цену.</p></div>
    <button class="hero-photo" id="featured" type="button" hidden>
      <img alt="" width="400" height="270"><span></span>
    </button>
  </section>
  <section class="catalog" aria-labelledby="catalog-title">
    <div class="heading"><h2 id="catalog-title">Каталог</h2><p id="count" role="status"></p></div>
    <div class="controls">
      <label class="search"><span>Поиск</span><input id="query" type="search" placeholder="Название или бренд"></label>
      <label><span>Бренд</span><select id="brand"><option value="">Все бренды</option></select></label>
    </div>
    <div class="categories" id="categories" role="group" aria-label="Категория"></div>
    <div id="grid" class="grid"></div>
    <p id="empty" hidden>По этим фильтрам ничего не найдено.</p>
  </section>
</main>
<dialog id="detail" aria-labelledby="detail-title">
  <div class="detail">
    <button type="button" class="close" id="close" aria-label="Закрыть">×</button>
    <div id="gallery"></div>
    <div class="detail-info">
      <p class="kicker" id="detail-brand"></p>
      <h2 id="detail-title"></h2>
      <p class="price" id="detail-price"></p>
      <dl id="facts"></dl>
      <p id="notes"></p>
      <p>Онлайн-заявки пока не подключены.</p>
    </div>
  </div>
</dialog>
<template id="card-template">
  <article class="card">
    <button class="cover" type="button"><img alt="" width="350" height="245" loading="lazy"><span class="no-photo"></span></button>
    <div class="card-info"><p class="card-brand"></p><h3></h3><p class="city"></p><div class="card-foot"><strong></strong><button type="button" class="more">Подробнее</button></div></div>
  </article>
</template>
</body>
</html>

<script src="gallery-1.js"></script>
<script src="gallery-2.js"></script>
<script src="gallery-3.js"></script>
<script src="gallery-4.js"></script>
<script src="gallery-addition.js"></script>
<script src="gallery-batch-1.js"></script>
<script src="gallery-batch-2.js"></script>
<script src="gallery-batch-3.js"></script>
<script src="gallery-batch-4.js"></script>
<script src="gallery-batch-5.js"></script>
<script src="gallery-batch-6.js"></script>
<script>const catalogItems = Array.from({length:46}, (_, i) => [galleryPart1,galleryPart2,galleryPart3,galleryPart4][i%4][Math.floor(i/4)]).concat(galleryAddition, Array.from({length:45}, (_, i) => [galleryBatch1,galleryBatch2,galleryBatch3,galleryBatch4,galleryBatch5,galleryBatch6][i%6][Math.floor(i/6)]));
const get = id => document.getElementById(id);
const labels = { tea:'Чай и кофе', tray:'Подносы', fruit:'Фруктовницы', bowl:'Чаши',
  candle:'Подсвечники', rare:'Редкие приборы', serve:'Сервировка', flatware:'Приборы',
  butter:'Маслёнки', plate:'Тарелки', furniture_storage:'Комоды и шкафы',
  furniture_tables:'Столы', furniture_seating:'Стулья и кресла', furniture_other:'Другая мебель', other:'Другое' };
const categoryLabel = key => labels[key] || key || 'Другое';
const state = { category:'' };
const dialog = get('detail');
const sorted = [...catalogItems].sort((a,b) => (b.photos.length > 0) - (a.photos.length > 0));
const price = item => '$' + item.price;
const clean = value => value.toLowerCase().replaceAll('ё','е');
const brand = get('brand');
const query = get('query');

for (const name of [...new Set(catalogItems.map(item => item.brand).filter(Boolean))].sort()) {
  brand.add(new Option(name, name));
}
for (const key of ['', ...new Set(catalogItems.map(item => item.category).filter(Boolean))]) {
  const button = document.createElement('button');
  button.textContent = key ? categoryLabel(key) : 'Все категории';
  button.type = 'button';
  button.dataset.category = key;
  button.setAttribute('aria-pressed', String(!key));
  button.addEventListener('click', () => {
    state.category = key;
    for (const tab of get('categories').children) {
      tab.setAttribute('aria-pressed', String(tab === button));
    }
    render();
  });
  get('categories').append(button);
}

function render() {
  const terms = clean(query.value.trim()).split(/\s+/).filter(Boolean);
  const matches = sorted.filter(item => {
    const searchable = clean([item.title, item.brand, categoryLabel(item.category)].join(' '));
    return (!state.category || item.category === state.category)
      && (!brand.value || item.brand === brand.value)
      && terms.every(term => searchable.includes(term));
  });
  const fragment = document.createDocumentFragment();
  for (const item of matches) {
    const card = get('card-template').content.cloneNode(true);
    const cover = card.querySelector('.cover');
    const img = card.querySelector('img');
    const placeholder = card.querySelector('.no-photo');
    img.hidden = !item.photos.length;
    placeholder.hidden = Boolean(item.photos.length);
    placeholder.textContent = 'Фото пока нет';
    if (item.photos.length) { img.src = item.photos[0]; img.alt = item.title; }
    cover.setAttribute('aria-label', 'Подробнее: ' + item.title);
    cover.addEventListener('click', () => openDetail(item));
    card.querySelector('.card-brand').textContent = item.brand || categoryLabel(item.category);
    card.querySelector('h3').textContent = item.title;
    card.querySelector('.city').textContent = categoryLabel(item.category);
    card.querySelector('strong').textContent = price(item);
    card.querySelector('.more').addEventListener('click', () => openDetail(item));
    fragment.append(card);
  }
  get('grid').replaceChildren(fragment);
  get('count').textContent = 'Лотов: ' + matches.length;
  get('empty').hidden = matches.length > 0;
}

function openDetail(item) {
  get('detail-brand').textContent = item.brand || categoryLabel(item.category);
  get('detail-title').textContent = item.title;
  get('detail-price').textContent = price(item);
  get('notes').textContent = item.description || 'Наличие и условия получения уточним при подтверждении заявки.';
  const facts = get('facts');
  facts.replaceChildren();
  for (const [label,value] of [
    ['Категория', categoryLabel(item.category)], ['Код товара', item.code]
  ]) {
    if (!value) continue;
    const term = document.createElement('dt');
    const content = document.createElement('dd');
    term.textContent = label;
    content.textContent = value;
    facts.append(term, content);
  }
  const gallery = get('gallery');
  gallery.replaceChildren();
  if (item.photos.length) {
    const main = document.createElement('img');
    const thumbList = document.createElement('div');
    thumbList.className = 'thumbs';
    thumbList.setAttribute('aria-label', 'Фотографии объявления');
    function select(index) {
      main.src = item.photos[index];
      main.alt = item.title + ' · фото ' + (index + 1);
      [...thumbList.children].forEach((button,i) => button.setAttribute('aria-pressed', String(i === index)));
    }
    item.photos.forEach((src,i) => {
      const button = document.createElement('button');
      const small = document.createElement('img');
      button.type = 'button';
      button.setAttribute('aria-label', 'Фото ' + (i + 1));
      small.src = src;
      small.alt = '';
      button.append(small);
      button.addEventListener('click', () => select(i));
      thumbList.append(button);
    });
    gallery.append(main);
    if (item.photos.length > 1) gallery.append(thumbList);
    select(0);
  } else {
    gallery.textContent = 'Фото пока не добавлены.';
  }
  dialog.showModal();
  get('close').focus();
}

get('close').addEventListener('click', () => dialog.close());
dialog.addEventListener('click', event => {
  if (event.target === dialog) dialog.close();
});
query.addEventListener('input', render);
brand.addEventListener('change', render);
const featured = sorted.find(item => item.photos.length > 1)
  || sorted.find(item => item.photos.length);
if (featured) {
  const button = get('featured');
  button.hidden = false;
  button.querySelector('img').src = featured.photos[0];
  button.querySelector('span').textContent = (featured.brand || categoryLabel(featured.category)) + ' · ' + price(featured);
  button.addEventListener('click', () => openDetail(featured));
}
render();

</script>
